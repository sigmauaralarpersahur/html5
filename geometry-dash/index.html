<base id="baseTag" href="https://web-dashers.github.io/">
<script>
    launch();

    function launch() {
        const baseHref = document.getElementById("baseTag").href;

        try {
            fetch("https://web-dashers.github.io/index.html?t=" + Date.now())
                .then(res => res.text())
                .then(html => {
                    if (html.includes("<head>")) {
                        html = html.replace(
                            "<head>",
                            `<head><base href="${baseHref}">`
                        );
                    } else {
                        html = `<base href="${baseHref}">` + html;
                    }

                    document.open();
                    document.write(html);
                    document.close();
                });
        } catch (error) {
            console.error("error:", error);
        }
    }
</script>
<script src="https://gcore.jsdelivr.net/gh/marty-games/shared/sitelock.js"></script>
